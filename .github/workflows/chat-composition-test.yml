name: chat-composition-test

on:
  push:
    branches:
      - axm/chat-creation-decomposer

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run complete repository tests
        run: python -m unittest discover -s tests -v
      - name: Run repository build gate
        run: python tools/build.py
      - name: Measure executable anatomy
        run: |
          PYTHONPATH=src python -m axm_uc executable > /tmp/executable.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/executable.json').read_text())
          summary = report['summary']
          assert summary['implemented_master_records'] == 2, summary
          assert summary['implemented_master_by_level'] == {'component': 2}, summary
          assert summary['live_capabilities'] == 6, summary
          assert summary['resolved_bindings'] == 4, summary
          print('EXECUTABLE_ANATOMY_OK', summary)
          PY
      - name: Exercise promoted manifest-only composite as live route
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'src')
          from axm_uc.machine import UniversalCreationMachine
          target = Path('/tmp/axm-live-composite')
          machine = UniversalCreationMachine(Path('.'))
          result = machine.create({
              'kind': 'verified-static-web-project',
              'direction': 'create and verify through live composite',
              'inputs': {
                  'path': str(target),
                  'project_type': 'static-web',
                  'files': {'index.html': '<!doctype html><html><body><main>Composite live</main></body></html>'},
                  'checks': [{'type': 'contains', 'path': 'index.html', 'text': 'Composite live'}],
              },
          })
          assert result['type'] == 'CREATION_RESULT', result
          assert result['capability'] == 'AXM-CAP-BUILD-VERIFY-PROJECT', result
          assert result['result']['build']['published'] is True, result
          assert result['result']['verification']['passed'] is True, result
          manifest = machine.capabilities.by_id('AXM-CAP-BUILD-VERIFY-PROJECT')
          assert manifest['implementation']['kind'] == 'DETERMINISTIC_COMPOSITE', manifest
          assert manifest['implementation']['source'] == 'this manifest', manifest
          assert manifest['root_fit']['truth']['fit'] is True
          assert not Path('capabilities/candidates/AXM-CAP-BUILD-VERIFY-PROJECT.json').exists()
          print('LIVE_COMPOSITE_OK')
          PY
      - name: Confirm planner reports live anatomy separately from lexical matching
        run: |
          PYTHONPATH=src python -m axm_uc plan examples/requests/create_real_site.json --per-level 20 > /tmp/plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path('/tmp/plan.json').read_text())
          assert plan['truth_status'] == 'DETERMINISTIC_LEXICAL_BASELINE'
          assert plan['executable_anatomy']['truth_status'] == 'EXPLICIT_LIVE_CAPABILITY_BINDINGS'
          print('PLANNER_EXECUTABLE_LAYER_OK', len(plan['executable_anatomy']['selected_records_with_declared_binding']))
          PY
