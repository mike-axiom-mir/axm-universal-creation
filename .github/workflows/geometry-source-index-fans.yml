name: Geometry source-index fan evidence

on:
  pull_request:
    branches:
      - main
      - studio/geometry-source-vertex-liveness-observer-001
    paths:
      - "src/axm_uc/mesh_topology.py"
      - "tests/test_mesh_topology.py"
      - "docs/MESH_TOPOLOGY_INSPECTOR.md"
      - ".github/workflows/geometry-source-index-fans.yml"
  workflow_dispatch:

jobs:
  source-index-fans:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout exact PR state
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile topology observer and regression tests
        run: python -m compileall -q src/axm_uc/mesh_topology.py tests/test_mesh_topology.py
      - name: Run exact mesh-topology regression suite
        run: python -m unittest tests.test_mesh_topology -v
