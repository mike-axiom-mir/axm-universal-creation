name: Physics Core Graft

on:
  pull_request:
    paths:
      - 'capabilities/physics-core/**'
      - 'capabilities/candidates/AXM-CAP-PHYSICS-FABRIC.json'
      - 'capabilities/candidates/AXM-CAP-PHYSICS-DISTANCE-JOINTS.json'
      - 'capabilities/candidates/AXM-CAP-PHYSICS-DISTANCE-LIMITS.json'
      - 'capabilities/candidates/AXM-CAP-PHYSICS-TRANSLATION-MOUNTS.json'
      - 'capabilities/candidates/AXM-CAP-PHYSICS-AXIS-LOCKS.json'
      - 'capabilities/candidates/AXM-CAP-PHYSICS-AXIS-LIMITS.json'
      - 'capabilities/candidates/AXM-CAP-PHYSICS-DIRECTION-LOCKS.json'
      - 'capabilities/candidates/AXM-CAP-PHYSICS-DIRECTION-LIMITS.json'
      - 'capabilities/candidates/AXM-CAP-PHYSICS-CONSTRAINT-COMPOSER.json'
      - 'capabilities/candidates/AXM-CAP-PHYSICS-CONSTRAINT-COLLISION-ISOLATION.json'
      - 'capabilities/candidates/AXM-CAP-PHYSICS-CONSTRAINT-ACTIVITY-GATE.json'
      - 'capabilities/candidates/AXM-CAP-PHYSICS-CONSTRAINT-PREFLIGHT.json'
      - 'capabilities/candidates/AXM-CAP-PHYSICS-CONSTRAINT-PREFLIGHT-GUARD.json'
      - '.github/workflows/physics-core-graft.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physics-core-graft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify imported core and UC physics fabric
        run: node capabilities/physics-core/selftest.js
      - name: Verify projected distance joints
        run: node capabilities/physics-core/distance-joints-selftest.js
      - name: Verify bounded distance limits
        run: node capabilities/physics-core/distance-limits-selftest.js
      - name: Verify translation mounts
        run: node capabilities/physics-core/translation-mounts-selftest.js
      - name: Verify single-axis translation locks
        run: node capabilities/physics-core/axis-locks-selftest.js
      - name: Verify bounded world-axis translation limits
        run: node capabilities/physics-core/axis-limits-selftest.js
      - name: Verify fixed-direction translation locks
        run: node capabilities/physics-core/direction-locks-selftest.js
      - name: Verify bounded fixed-direction translation limits
        run: node capabilities/physics-core/direction-limits-selftest.js
      - name: Verify mixed constraint composer
        run: node capabilities/physics-core/constraint-composer-selftest.js
      - name: Verify constraint component collision isolation
        run: node capabilities/physics-core/constraint-collision-isolation-selftest.js
      - name: Verify disabled constraint activity gate
        run: node capabilities/physics-core/constraint-activity-gate-selftest.js
      - name: Verify conservative constraint preflight
        run: node capabilities/physics-core/constraint-preflight-selftest.js
      - name: Verify exact full-precision projection geometry view
        run: node capabilities/physics-core/exact-projection-geometry-selftest.js
      - name: Verify fail-closed constraint preflight guard
        run: node capabilities/physics-core/constraint-preflight-guard-selftest.js
      - name: Verify bounded orthogonal projection preflight and guard
        run: node capabilities/physics-core/orthogonal-projection-preflight-selftest.js
      - name: Verify pair-indexed orthogonal proof lookup
        run: node capabilities/physics-core/orthogonal-projection-pair-index-selftest.js
      - name: Verify exact finite two-projection radial envelopes
        run: node capabilities/physics-core/two-projection-radial-envelope-selftest.js
      - name: Verify single-zero projection envelope edge reduction
        run: node capabilities/physics-core/single-zero-projection-envelope-selftest.js
      - name: Verify two-active-edge projection envelope reduction
        run: node capabilities/physics-core/two-active-edge-projection-envelope-selftest.js
      - name: Verify origin-symmetric projection envelope corner reduction
        run: node capabilities/physics-core/origin-symmetric-projection-envelope-selftest.js
      - name: Verify one-degenerate finite projection envelope work reduction
        run: node capabilities/physics-core/one-degenerate-projection-envelope-selftest.js
      - name: Verify tolerated empty projection intervals do not fabricate exact envelopes
        run: node capabilities/physics-core/tolerated-empty-projection-envelope-selftest.js
      - name: Verify axis-lock composer gate and isolation integration
        run: node capabilities/physics-core/axis-lock-integration-selftest.js
      - name: Verify axis-limit composer gate and isolation integration
        run: node capabilities/physics-core/axis-limit-integration-selftest.js
      - name: Verify fixed-direction lock activity and isolation integration
        run: node capabilities/physics-core/direction-lock-integration-selftest.js
      - name: Verify fixed-direction limit composer gate and isolation integration
        run: node capabilities/physics-core/direction-limit-integration-selftest.js
