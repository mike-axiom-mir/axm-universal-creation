name: Geometry directional texel-density observer

on:
  pull_request:
    paths:
      - 'src/axm_uc/material_uv_evidence.py'
      - 'tests/test_material_uv_evidence.py'
      - 'docs/MATERIAL_UV_EVIDENCE.md'
      - '.github/workflows/geometry-directional-texel-density-observer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile observer and focused regression
        run: |
          python -m py_compile src/axm_uc/material_uv_evidence.py tests/test_material_uv_evidence.py
          python -m unittest tests.test_material_uv_evidence -v
