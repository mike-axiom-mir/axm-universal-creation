name: Bootstrap normalized skin-weight receiver parity

on:
  push:
    branches: [studio/uc-normalized-skin-weight-receiver-001]

permissions:
  contents: write

jobs:
  bounded-receiver-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/uc-normalized-skin-weight-receiver-001
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply exact receiver-contract repair and add focused evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          codec = Path('capabilities/platform-hands/shared/asset-hands/rigged-gltf-codec.js')
          text = codec.read_text()

          old_decode = '''        else
          v = new DataView(
            parsed.bytes.buffer,
            parsed.bytes.byteOffset + at,
            4,
          ).getFloat32(0, true);
        values.push(v);'''
          new_decode = '''        else
          v = new DataView(
            parsed.bytes.buffer,
            parsed.bytes.byteOffset + at,
            4,
          ).getFloat32(0, true);
        if (
          accessor.normalized === true &&
          (accessor.componentType === 5121 || accessor.componentType === 5123)
        )
          v /= accessor.componentType === 5121 ? 255 : 65535;
        values.push(v);'''
          assert text.count(old_decode) == 1, 'expected exact accessor decode site once'
          text = text.replace(old_decode, new_decode, 1)

          old_weight = '''      if (
        !weightAccessor ||
        weightAccessor.type !== "VEC4" ||
        weightAccessor.componentType !== 5126
      )
        errors.push("WEIGHTS_0 accessor invalid");'''
          new_weight = '''      var weightComponent =
          weightAccessor && weightAccessor.componentType,
        weightNormalized =
          weightAccessor && weightAccessor.normalized === true,
        weightNormalizedFieldValid =
          !!weightAccessor &&
          (weightAccessor.normalized == null ||
            typeof weightAccessor.normalized === "boolean"),
        weightFormatValid =
          !!weightAccessor &&
          weightAccessor.type === "VEC4" &&
          weightNormalizedFieldValid &&
          ((weightComponent === 5126 && !weightNormalized) ||
            ([5121, 5123].indexOf(weightComponent) >= 0 &&
              weightNormalized));
      if (!weightFormatValid) errors.push("WEIGHTS_0 accessor invalid");'''
          assert text.count(old_weight) == 1, 'expected exact WEIGHTS_0 validation site once'
          text = text.replace(old_weight, new_weight, 1)
          codec.write_text(text)

          tests = Path('capabilities/platform-hands/shared/asset-hands/tests')
          tests.mkdir(parents=True, exist_ok=True)
          tests.joinpath('normalized-skin-weight-receiver-selftest.js').write_text(r'''"use strict";
const assert = require("assert");
const Rig = require("../rigged-gltf-codec");

function unpack(bytes) {
  bytes = new Uint8Array(bytes);
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  assert.strictEqual(view.getUint32(0, true), 0x46546c67);
  const jsonLength = view.getUint32(12, true);
  const json = JSON.parse(new TextDecoder().decode(bytes.subarray(20, 20 + jsonLength)).trim());
  const binHeader = 20 + jsonLength;
  const binLength = view.getUint32(binHeader, true);
  const binary = bytes.slice(binHeader + 8, binHeader + 8 + binLength);
  return { json, binary };
}

function repack(json, binary) {
  const jsonRaw = new TextEncoder().encode(JSON.stringify(json));
  const jsonLength = Math.ceil(jsonRaw.length / 4) * 4;
  const binLength = Math.ceil(binary.length / 4) * 4;
  const out = new Uint8Array(12 + 8 + jsonLength + 8 + binLength);
  const view = new DataView(out.buffer);
  view.setUint32(0, 0x46546c67, true);
  view.setUint32(4, 2, true);
  view.setUint32(8, out.length, true);
  view.setUint32(12, jsonLength, true);
  view.setUint32(16, 0x4e4f534a, true);
  out.fill(32, 20, 20 + jsonLength);
  out.set(jsonRaw, 20);
  const binHeader = 20 + jsonLength;
  view.setUint32(binHeader, binLength, true);
  view.setUint32(binHeader + 4, 0x004e4942, true);
  out.set(binary, binHeader + 8);
  return out;
}

function variant(sourceBytes, componentType, normalized) {
  const parsed = unpack(sourceBytes);
  const json = JSON.parse(JSON.stringify(parsed.json));
  const binary = parsed.binary.slice();
  const primitive = json.meshes[0].primitives[0];
  const accessor = json.accessors[primitive.attributes.WEIGHTS_0];
  const bufferView = json.bufferViews[accessor.bufferView];
  const count = accessor.count;
  const offset = (bufferView.byteOffset || 0) + (accessor.byteOffset || 0);
  const data = new DataView(binary.buffer, binary.byteOffset, binary.byteLength);
  const max = componentType === 5121 ? 255 : componentType === 5123 ? 65535 : 1;
  const size = componentType === 5121 ? 1 : componentType === 5123 ? 2 : 4;
  accessor.componentType = componentType;
  if (normalized === undefined) delete accessor.normalized;
  else accessor.normalized = normalized;
  delete bufferView.byteStride;
  for (let vertex = 0; vertex < count; vertex += 1) {
    const row = vertex < Math.floor(count / 2) ? [1, 0, 0, 0] : [0, 1, 0, 0];
    for (let c = 0; c < 4; c += 1) {
      const at = offset + (vertex * 4 + c) * size;
      if (componentType === 5121) data.setUint8(at, row[c] * max);
      else if (componentType === 5123) data.setUint16(at, row[c] * max, true);
      else data.setFloat32(at, row[c], true);
    }
  }
  return repack(json, binary);
}

const packed = Rig.pack(Rig.makeClip({ fps: 8, duration: 1, id: "normalized-weight-receiver-fixture" }));
const floatControl = variant(packed.bytes, 5126, undefined);
const u8 = variant(packed.bytes, 5121, true);
const u16 = variant(packed.bytes, 5123, true);
const controlInspection = Rig.inspect(floatControl);
assert.strictEqual(controlInspection.pass, true, controlInspection.errors.join("; "));
for (const [name, bytes] of [["normalized-u8", u8], ["normalized-u16", u16]]) {
  const inspection = Rig.inspect(bytes);
  assert.strictEqual(inspection.pass, true, `${name}: ${inspection.errors.join("; ")}`);
  assert.strictEqual(inspection.weightSumsPass, true);
  assert.strictEqual(inspection.jointIndicesPass, true);
  assert.strictEqual(inspection.deformation.pass, true);
  assert.strictEqual(inspection.deformation.changed, true);
  assert.deepStrictEqual(inspection.deformation.samples, controlInspection.deformation.samples);
}
for (const [name, bytes] of [
  ["u8-without-normalized", variant(packed.bytes, 5121, false)],
  ["u16-without-normalized", variant(packed.bytes, 5123, undefined)],
  ["normalized-float", variant(packed.bytes, 5126, true)],
]) {
  const inspection = Rig.inspect(bytes);
  assert.strictEqual(inspection.pass, false, `${name} unexpectedly passed`);
  assert(inspection.errors.includes("WEIGHTS_0 accessor invalid"), `${name}: ${inspection.errors.join("; ")}`);
}
console.log("PASS_NORMALIZED_SKIN_WEIGHT_RECEIVER_PARITY");
''')

          workflow = Path('.github/workflows/normalized-skin-weight-receiver.yml')
          workflow.write_text('''name: Normalized skin-weight receiver parity\n\non:\n  pull_request:\n    paths:\n      - "capabilities/platform-hands/shared/asset-hands/rigged-gltf-codec.js"\n      - "capabilities/platform-hands/shared/asset-hands/tests/normalized-skin-weight-receiver-selftest.js"\n      - ".github/workflows/normalized-skin-weight-receiver.yml"\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  receiver-parity:\n    runs-on: ubuntu-latest\n    timeout-minutes: 10\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          ref: ${{ github.event.pull_request.head.sha || github.sha }}\n      - uses: actions/setup-python@v5\n        with:\n          python-version: '3.11'\n      - name: Verify JS rigged receiver normalized skin-weight contract\n        run: node capabilities/platform-hands/shared/asset-hands/tests/normalized-skin-weight-receiver-selftest.js\n      - name: Cross-check existing Python game-pose receiver contract\n        run: python -m unittest tests.test_game_pose_runtime.GamePoseRuntimeTests.test_normalized_integer_weights_are_supported -v\n''')
          PY

      - name: Prove focused receiver parity before commit
        run: |
          set -euo pipefail
          node capabilities/platform-hands/shared/asset-hands/tests/normalized-skin-weight-receiver-selftest.js
          python -m unittest tests.test_game_pose_runtime.GamePoseRuntimeTests.test_normalized_integer_weights_are_supported -v

      - name: Commit only the reusable receiver repair
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/uc-normalized-skin-weight-receiver-bootstrap.yml
          git config user.name "AXM Technical Art / UC Integration"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add capabilities/platform-hands/shared/asset-hands/rigged-gltf-codec.js \
            capabilities/platform-hands/shared/asset-hands/tests/normalized-skin-weight-receiver-selftest.js \
            .github/workflows/normalized-skin-weight-receiver.yml
          git diff --cached --check
          git commit -m "Align normalized skin-weight receiver semantics"
          git push origin HEAD:studio/uc-normalized-skin-weight-receiver-001
