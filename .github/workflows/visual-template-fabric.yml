      - '.github/workflows/visual-template-fabric.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -p 'test_visual_templates.py' -v
      - run: python tools/visual_template_proof.py visual-template-proof
      - uses: actions/upload-artifact@v4
        with:
          name: visual-template-proof
          path: visual-template-proof
