name: Profession crew verification
on:
  pull_request:
  workflow_dispatch:
jobs:
  crew:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify profession crews and existing specialist workflows
        env:
          PYTHONPATH: src:tests
        run: python -m unittest test_profession_crew test_profession_target_evidence test_profession_clearance_repair test_sticker_clearance_contact test_software_glb_preview test_stepwise_workflow test_specialist_tournament test_machine test_procedural_3d test_static_asset_target_evidence test_native_textures test_product_workflow test_surface_workshop test_material_uv_evidence test_game_material_styles test_game_material_layers test_game_material_bridge test_aftertouch_media_observers test_aftertouch_preview test_evolution_aftertouch -q
      - name: Observe real failure, learning, repair and re-verification
        run: python tools/profession_crew_demo.py
      - name: Reuse a verified repair on two actual UC vehicle recipes
        run: python tools/profession_clearance_demo.py "${RUNNER_TEMP}/vehicle-clearance-${{ matrix.python }}" --no-render
      - name: Build, inspect and refine a textured product through its profession workflow
        run: python tools/product_workflow_demo.py "${RUNNER_TEMP}/product-workflow-${{ matrix.python }}" --quick
