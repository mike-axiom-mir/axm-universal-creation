name: chat-real-creation-readiness

on:
  push:
    branches:
      - axm/chat-creation-decomposer

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run complete repository tests
        run: python -m unittest discover -s tests -v
      - name: Run repository build gate
        run: python tools/build.py
      - name: Run real static website trial
        run: |
          PYTHONPATH=src python -m axm_uc trial examples/requests/create_real_site.json > /tmp/real-trial.json
          python - <<'PY'
          import json
          from pathlib import Path
          trial = json.loads(Path('/tmp/real-trial.json').read_text())
          assert trial['type'] == 'CREATION_TRIAL'
          assert trial['passed'] is True
          assert trial['creation']['type'] == 'CREATION_RESULT'
          assert trial['verification']['type'] == 'CREATION_RESULT'
          assert trial['verification']['result']['passed'] is True
          root = Path('creations/first-real-site')
          assert (root / 'index.html').is_file()
          assert (root / 'style.css').is_file()
          assert (root / 'app.js').is_file()
          print('REAL_CREATION_TRIAL_OK', len(trial['creation']['result']['files']))
          PY
      - name: Re-verify published site independently
        run: |
          PYTHONPATH=src python -m axm_uc create examples/requests/verify_real_site.json > /tmp/verify-site.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/verify-site.json').read_text())
          assert report['type'] == 'CREATION_RESULT'
          assert report['result']['passed'] is True
          print('INDEPENDENT_VERIFY_OK')
          PY
      - name: Confirm failed project does not publish
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'src')
          from axm_uc.machine import UniversalCreationMachine
          target = Path('/tmp/axm-broken-project')
          result = UniversalCreationMachine(Path('.')).create({
              'kind': 'static-web-project',
              'inputs': {
                  'path': str(target),
                  'project_type': 'static-web',
                  'files': {'index.html': '<link rel="stylesheet" href="missing.css">'},
              },
          })
          assert result['type'] == 'CREATION_ERROR'
          assert not target.exists()
          print('FAILED_PROJECT_STAYED_UNPUBLISHED')
          PY
