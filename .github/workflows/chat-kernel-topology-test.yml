name: chat-kernel-topology-test

on:
  push:
    branches:
      - axm/chat-creation-decomposer

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run complete repository tests
        run: python -m unittest discover -s tests -v
      - name: Run repository build gate
        run: python tools/build.py
      - name: Measure crosswalk and kernel topology
        run: |
          PYTHONPATH=src python -m axm_uc topology > /tmp/topology.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/topology.json').read_text())
          s = data['summary']
          assert s['master_records'] == 2165
          assert s['core_records'] == 100
          assert s['master_dependency_edges'] == 0
          assert s['master_relationship_edges'] == 0
          assert s['core_dependency_edges'] == 175
          assert s['core_resolved_dependency_edges'] == 175
          assert s['core_unresolved_dependency_edges'] == 0
          assert s['traversable_master_records'] > 0
          print('TOPOLOGY_SUMMARY', json.dumps(s, sort_keys=True))
          PY
      - name: Traverse graph component from master anatomy
        run: |
          PYTHONPATH=src python -m axm_uc topology --master-id AXM-02-DATA-MATH-C-012-graph --depth 4 > /tmp/graph-topology.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/graph-topology.json').read_text())
          assert data['master_mapping']['core_id'] == 'AXM-CORE-C-006-graph'
          ids = {x['id'] for x in data['traversal']['nodes']}
          assert 'AXM-CORE-A-028-node-reference' in ids
          assert 'AXM-CORE-A-029-edge' in ids
          assert 'AXM-CORE-A-022-relation-predicate' in ids
          assert not data['traversal']['unresolved_edges']
          print('GRAPH_TRAVERSAL_OK', len(data['traversal']['nodes']), len(data['traversal']['edges']))
          PY
      - name: Exercise topology-backed planning
        run: |
          PYTHONPATH=src python -m axm_uc plan examples/requests/plan_graph.json --per-level 8 > /tmp/graph-plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/graph-plan.json').read_text())
          seeds = data['kernel_topology']['traversal']['seed_ids']
          assert 'AXM-CORE-C-006-graph' in seeds
          assert data['kernel_topology']['traversal']['edges']
          assert data['gap']['smallest_visible_gap']['kind'] == 'kernel-backed-unimplemented-path'
          print('GRAPH_PLAN_OK', len(seeds), len(data['kernel_topology']['traversal']['nodes']))
          PY
