name: Novel MorphTile UC 3D scene

on:
  push:
    branches: [main]
    paths:
      - 'tools/blender/morphtile_spatial_demo.py'
      - '.github/workflows/morphtile-novel-3d.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install deterministic Blender runtime
        run: python -m pip install 'numpy==1.26.4' 'Pillow>=10,<12' 'bpy==4.3.0'
      - name: Build new MorphTile scene through UC 3D body
        run: python tools/blender/morphtile_spatial_demo.py --output /tmp/morphtile-novel-3d
      - name: Inspect new GLB with UC inspector
        run: |
          PYTHONPATH=src python - <<'PY'
          import json
          from pathlib import Path
          from axm_uc.visual_3d import inspect_glb
          p=Path('/tmp/morphtile-novel-3d/MorphTile-Spatial-Demo.glb')
          r=inspect_glb(p)
          Path('/tmp/morphtile-novel-3d/glb-inspection.json').write_text(json.dumps(r,indent=2))
          if not r.get('valid_glb'): raise SystemExit('UC GLB inspection failed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morphtile-novel-uc-3d
          path: /tmp/morphtile-novel-3d
          retention-days: 14
