name: Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR state
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Run full unittest suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify character inspector input routing
        run: node tools/character_inspector/inspection_controls.test.mjs
