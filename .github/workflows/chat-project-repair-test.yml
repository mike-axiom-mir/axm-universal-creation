name: chat-project-repair-test

on:
  push:
    branches:
      - axm/chat-creation-decomposer

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run complete repository tests
        run: python -m unittest discover -s tests -v
      - name: Run repository build gate
        run: python tools/build.py
      - name: Measure executable anatomy after repair capability
        run: |
          PYTHONPATH=src python -m axm_uc executable > /tmp/executable.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/executable.json').read_text())
          summary = report['summary']
          assert summary['live_capabilities'] == 8, summary
          assert summary['implemented_master_records'] == 3, summary
          assert summary['implemented_master_by_level'] == {'component': 3}, summary
          assert summary['resolved_bindings'] == 9, summary
          print('REPAIR_EXECUTABLE_ANATOMY_OK', summary)
          PY
      - name: Exercise real verified repair route
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'src')
          from axm_uc.machine import UniversalCreationMachine
          target = Path('/tmp/axm-repair-site')
          machine = UniversalCreationMachine(Path('.'))
          created = machine.create({
              'kind': 'static-web-project',
              'inputs': {
                  'path': str(target),
                  'project_type': 'static-web',
                  'files': {
                      'index.html': '<!doctype html><html><body><main>before</main></body></html>',
                      'app.js': "document.body.dataset.original = 'yes';\n",
                  },
              },
          })
          assert created['type'] == 'CREATION_RESULT', created
          after = '<!doctype html><html><body><main>after</main></body></html>'
          repaired = machine.create({
              'kind': 'verified-static-web-repair',
              'inputs': {
                  'path': str(target),
                  'project_type': 'static-web',
                  'operations': [{'op': 'update', 'path': 'index.html', 'content': after}],
                  'checks': [{'type': 'contains', 'path': 'index.html', 'text': '<main>after</main>'}],
              },
          })
          assert repaired['type'] == 'CREATION_RESULT', repaired
          assert repaired['capability'] == 'AXM-CAP-VERIFIED-PROJECT-REPAIR', repaired
          assert repaired['result']['repair']['published'] is True, repaired
          assert repaired['result']['verification']['passed'] is True, repaired
          assert (target / 'index.html').read_text() == after
          assert (target / 'app.js').read_text() == "document.body.dataset.original = 'yes';\n"
          print('VERIFIED_REPAIR_OK')
          PY
