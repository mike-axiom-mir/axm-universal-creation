name: rebuild-reference-mirrors

on:
  push:
    branches:
      - axm/reference-body-repair
    paths:
      - tools/rebuild_reference_mirrors.py
      - .github/workflows/rebuild-reference-mirrors.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: axm/reference-body-repair
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild reference mirrors
        run: python tools/rebuild_reference_mirrors.py
      - name: Verify canonical counts and mirror presence
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path('.')
          master = json.loads((root/'reference/AXM_Universal_Creation_Map_v0.1/registry/master_registry.json').read_text())['records']
          core = json.loads((root/'reference/AXM_Universal_Creation_Map_v0.1/registry/core_build_seed.json').read_text())['records']
          counts = {}
          for row in master:
              counts[row['level']] = counts.get(row['level'], 0) + 1
          assert len(master) == 2165, len(master)
          assert counts == {'atom': 1000, 'component': 750, 'organ': 415}, counts
          assert len(core) == 100, len(core)
          required = [
              root/'reference/AXM_Universal_Creation_Map_v0.1/registry/master_registry.csv',
              root/'reference/AXM_Universal_Creation_Map_v0.1/AXM_ALL_IN_ONE_MASTER_LIST.md',
              root/'reference/AXM_Universal_Creation_Map_v0.1/VALIDATION_REPORT.json',
              root/'reference/AXM_Universal_Creation_Map_v0.1/sources/SOURCE_CATALOG.md',
              root/'reference/AXM_asset_atoms_only/AXM_SOFTWARE_ASSET_ATOMS_1000.csv',
              root/'reference/AXM_asset_atoms_only/AXM_SOFTWARE_ASSET_ATOMS_1000.json',
              root/'reference/AXM_asset_atoms_only/AXM_SOFTWARE_ASSET_ATOMS_1000.txt',
          ]
          for path in required:
              assert path.is_file(), path
          atoms = json.loads(required[5].read_text())['atoms']
          assert len(atoms) == 1000
          with required[4].open(newline='', encoding='utf-8') as handle:
              assert sum(1 for _ in csv.DictReader(handle)) == 1000
          print('verified', len(master), counts, 'core', len(core), 'atoms', len(atoms))
          PY
      - name: Run repository tests
        run: python -m unittest discover -s tests
      - name: Commit restored mirrors
        run: |
          if git diff --quiet -- reference; then
            echo "Reference mirrors already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference
          git commit -m "Restore complete Universal Creation reference mirrors"
          git push origin HEAD:axm/reference-body-repair
