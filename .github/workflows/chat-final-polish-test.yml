name: chat-final-polish-test

on:
  push:
    branches:
      - axm/chat-creation-decomposer

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run complete repository tests
        run: python -m unittest discover -s tests -v
      - name: Run repository build gate
        run: python tools/build.py
      - name: Exercise direction suggestions
        run: |
          PYTHONPATH=src python -m axm_uc directions --suggest "multiplayer RTS game with shared world state" > /tmp/directions.json
          python - <<'PY'
          import json
          from pathlib import Path
          body=json.loads(Path('/tmp/directions.json').read_text())
          report=body['suggestions']
          ids=[row['direction_id'] for row in report['candidates']]
          assert 'game' in ids, ids
          assert 'collaboration-multiplayer' in ids, ids
          assert report['automatic_selection'] is False
          print('DIRECTION_SUGGESTION_OK', ids[:5])
          PY
      - name: Exercise explicit direction-enriched planning
        run: |
          cat > /tmp/rts.json <<'JSON'
          {
            "kind": "software-project",
            "direction": "Build a multiplayer RTS game",
            "software_directions": {
              "direction_ids": ["game", "collaboration-multiplayer"],
              "runtime": ["browser"],
              "distribution": ["local-file"]
            },
            "inputs": {"path": "creations/rts"}
          }
          JSON
          PYTHONPATH=src python -m axm_uc plan /tmp/rts.json > /tmp/plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          body=json.loads(Path('/tmp/plan.json').read_text())
          assert body['software_direction']['stack']['result']=='DIRECTION_STACK_READY_NO_AUTHORITY'
          assert body['explicit_planning_context'] is not None
          assert 'frame' in body['request_terms']
          assert 'shared' in body['request_terms']
          print('DIRECTION_PLAN_OK', body['software_direction']['stack']['direction_ids'])
          PY
