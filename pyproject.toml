[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axm-universal-creation"
version = "0.1.0"
description = "Standalone inspectable persistent universal creation runtime"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
axm-uc = "axm_uc.cli:main"
axm-assets = "axm_uc.visual_assets_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
axm_uc = ["data/visual_state/*.json"]
