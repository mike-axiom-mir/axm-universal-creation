[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axm-universal-creation"
version = "0.1.0"
description = "Standalone inspectable persistent universal creation runtime"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
axm-uc = "axm_uc.cli:main"
axm-assets = "axm_uc.visual_assets_cli:main"
axm-practice = "axm_uc.creative_practice:main"
axm-uc-portable = "axm_uc.portable_cli:main"
axm-effects = "axm_uc.procedural_effects:main"
axm-stickers = "axm_stickers.__main__:main"
axm-sticker-create = "axm_uc.sticker_create:main"
axm-create-parallel = "axm_uc.parallel_create:main"
axm-create-surface = "axm_uc.surface_creation:main"
axm-visual-templates = "axm_uc.visual_templates_cli:main"
axm-native-visual = "axm_uc.native_visual_engine:main"
axm-math-create = "axm_uc.math_creation:main"
axm-rich-materials = "axm_uc.rich_game_material_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
axm_uc = ["data/engine/*.gd", "data/professions/*.json", "data/professions/LICENSE", "data/professions/NOTICE", "data/visual_state/*.json", "data/*.html", "data/rts/*.json", "data/rts/*.html", "data/studio/*.js", "data/studio/*.cjs", "data/studio/LICENSE", "data/studio/NOTICE", "data/parallel/*.mjs", "data/parallel/*.json", "data/parallel/LICENSE", "data/parallel/NOTICE"]
